services:
  postgres:
    image: postgres:16  #Utiliza la versión 16 de PostgreSQL
    container_name: tienda_db # Nombre del contenedor
    environment:
      POSTGRES_DB: tienda
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432" #conexion de mi ordenador al contenedor
    volumes:
      - postgres_data:/var/lib/postgresql/data #aqui guardamos los datos de la base de datos 

  web:
    build: .
    container_name: tienda_web
    command: sh -c "python manage.py migrate && gunicorn mysite.wsgi:application --bind 0.0.0.0:8000"
    depends_on:
      - postgres
    volumes:
      - .:/app
      - static_volume:/app/static
      - media_volume:/app/media
    expose:
      - 8000
    env_file:
      - .env

  nginx:
    image: nginx:1.25-alpine
    container_name: tienda_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/static
      - media_volume:/app/media
    depends_on:
      - web
 


volumes:
  postgres_data:
  static_volume:
  media_volume:
